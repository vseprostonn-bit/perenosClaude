<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Образ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --text:#1A1A1E;--hint:#9A8F8F;--accent:#FF4D6A;--accent2:#FF8FA3;
  --border:#F2E6E2;--card:#fff;
  --shadow:0 4px 6px rgba(255,77,106,.06),0 10px 24px rgba(255,143,163,.10);
  --spring:cubic-bezier(.16,1,.3,1);
}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#FFF8F6,#FFEDE8);
  background-attachment:fixed;color:var(--text);min-height:100vh;padding-bottom:24px;overflow-x:hidden;}
h1,h2,h3{font-family:'Manrope',sans-serif;}
.wrap{max-width:440px;margin:0 auto;padding:0 16px;}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;max-width:440px;margin:0 auto;}
.logo{font-family:'Manrope';font-weight:800;font-size:22px;}
.logo span{color:var(--accent);}
.hero{padding:6px 16px 16px;max-width:440px;margin:0 auto;}
.hero h1{font-size:24px;font-weight:800;margin-bottom:6px;}
.hero p{color:var(--hint);font-size:14px;line-height:1.5;}
.actions{display:flex;flex-direction:column;gap:12px;padding:4px 16px;max-width:440px;margin:0 auto;}
.act{border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;
  transition:transform .15s var(--spring);}
.act:active{transform:scale(.98);}
.act.scan{background:linear-gradient(135deg,#FF4D6A,#FF8FA3);}
.act.feed{background:linear-gradient(135deg,#1A1A1E,#3A2E36);}
.act .emoji{position:absolute;top:14px;right:16px;font-size:38px;opacity:.9;}
.act .badge{background:rgba(255,255,255,.22);border-radius:20px;padding:4px 10px;font-size:11px;
  font-weight:600;margin-bottom:8px;width:fit-content;}
.act h3{font-size:19px;font-weight:700;margin-bottom:3px;}
.act p{font-size:13px;opacity:.88;}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:14px;
  padding:14px 16px 4px;cursor:pointer;max-width:440px;margin:0 auto;}
.hidden{display:none;}
/* загруженное фото */
.uploaded{margin:8px 16px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);max-width:440px;margin-left:auto;margin-right:auto;position:relative;}
.uploaded img{width:100%;max-height:340px;object-fit:cover;display:block;}
.uploaded .vibe{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.7));font-family:'Manrope';font-weight:700;font-size:16px;}
/* карточки */
.items{padding:6px 16px;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.item{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;}
.item img{width:110px;height:140px;object-fit:cover;background:#eee;flex-shrink:0;}
.item .info{flex:1;padding:12px 12px 10px;display:flex;flex-direction:column;}
.item .slot{color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.item .conf{font-size:12px;color:var(--hint);margin:2px 0 4px;}
.item .name{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px;}
.item .price{font-family:'Manrope';font-weight:700;font-size:16px;}
.item .store{color:var(--hint);font-size:12px;margin-bottom:auto;}
.buy{margin-top:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  text-decoration:none;text-align:center;border-radius:11px;padding:9px;font-weight:600;font-size:13px;
  font-family:'Manrope';}
.msg{padding:24px 20px;text-align:center;color:var(--hint);font-size:14px;line-height:1.5;max-width:440px;margin:0 auto;}
.loader{padding:40px 20px;text-align:center;color:var(--hint);}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
/* готовые образы */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px;max-width:440px;margin:0 auto;}
.look{border-radius:16px;overflow:hidden;background:#eee;box-shadow:var(--shadow);position:relative;}
.look img{width:100%;height:220px;object-fit:cover;display:block;}
.look .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.65));font-size:12px;font-weight:600;}
</style>
</head>
<body>
<div class="top"><div class="logo">Ob<span>raz</span></div></div>

<!-- HOME -->
<div id="home">
  <div class="hero">
    <h1 id="hi">Привет 👋</h1>
    <p>Кинь фото лука - соберу его из реальных вещей с ценами и «купить». Или листай готовые образы.</p>
  </div>
  <div class="actions">
    <div class="act scan" onclick="pickPhoto()">
      <span class="emoji">📸</span><span class="badge">Наша фишка</span>
      <h3>Разобрать лук по фото</h3><p>Скрин с Pinterest → похожие вещи за минуту</p>
    </div>
    <div class="act feed" onclick="openFeed()">
      <span class="emoji">✨</span><h3>Готовые образы</h3><p>Подборки под твой стиль</p>
    </div>
  </div>
</div>
<input type="file" id="file" accept="image/*" class="hidden" onchange="doScan()">

<!-- SCAN -->
<div id="scan" class="hidden">
  <div class="back" onclick="goHome()">‹ назад</div>
  <div id="scanBody"></div>
</div>

<!-- FEED -->
<div id="feed" class="hidden">
  <div class="back" onclick="goHome()">‹ назад</div>
  <div id="feedBody"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); }
const initData = tg?.initData || "";
const name = tg?.initDataUnsafe?.user?.first_name;
if (name) document.getElementById('hi').textContent = `Привет, ${name} 👋`;

function show(id){ for(const s of ['home','scan','feed']) document.getElementById(s).classList.toggle('hidden', s!==id); }
function goHome(){ show('home'); }
function pickPhoto(){ document.getElementById('file').click(); }

function confLine(c, p){
  if(c==='exact') return 'Это она';
  if(c==='close') return 'Очень похоже, '+p+'%';
  return 'Похоже, '+p+'%';
}

async function doScan(){
  const f = document.getElementById('file').files[0];
  if(!f) return;
  show('scan');
  const body = document.getElementById('scanBody');
  const url = URL.createObjectURL(f);
  body.innerHTML = `<div class="uploaded"><img src="${url}"></div><div class="loader"><div class="spin"></div>Разбираю образ… 10-15 секунд</div>`;
  try{
    const fd = new FormData(); fd.append('photo', f);
    const r = await fetch('/api/scan', { method:'POST', headers:{'X-Telegram-Init-Data': initData}, body: fd });
    if(r.status===402){ body.innerHTML = `<div class="msg">Бесплатный разбор использован 🙌<br>Оформи подписку в боте, чтобы разбирать без лимита.</div>`; return; }
    if(r.status===422){ body.innerHTML = `<div class="msg">Не вижу на фото образа. Кинь фото лука - с Pinterest или из соцсетей.</div>`; return; }
    if(!r.ok){ body.innerHTML = `<div class="msg">Не получилось разобрать, попробуй ещё раз.</div>`; return; }
    const data = await r.json();
    let html = `<div class="uploaded"><img src="${url}"><div class="vibe">${data.vibe||'Твой образ'}</div></div><div class="items">`;
    let any=false;
    for(const it of data.items){
      if(!it.products || !it.products.length) continue;
      any=true;
      const p = it.products[0];
      html += `<div class="item"><img src="${p.photo_url||''}"><div class="info">
        <span class="slot">${slotName(it.slot)}</span>
        <span class="conf">≈ ${confLine(it.confidence, it.match_percent)}</span>
        <div class="name">${p.title}</div>
        <div class="price">${fmt(p.price)} ₽</div>
        <div class="store">${storeName(p.store)}</div>
        <a class="buy" href="${p.buy_url}" target="_blank">Купить</a>
      </div></div>`;
    }
    html += `</div>`;
    if(!any) html += `<div class="msg">Точных совпадений не нашла. Попробуй другой лук.</div>`;
    body.innerHTML = html;
  }catch(e){ body.innerHTML = `<div class="msg">Ошибка сети. Попробуй ещё раз.</div>`; }
}

async function openFeed(){
  show('feed');
  const body = document.getElementById('feedBody');
  body.innerHTML = `<div class="loader"><div class="spin"></div>Загружаю образы…</div>`;
  try{
    const r = await fetch('/api/outfits', { headers:{'X-Telegram-Init-Data': initData} });
    if(!r.ok){ body.innerHTML = `<div class="msg">Не удалось загрузить образы.</div>`; return; }
    const list = await r.json();
    if(!list.length){ body.innerHTML = `<div class="msg">Образы скоро появятся ✨</div>`; return; }
    let html = `<div class="grid">`;
    for(const o of list){
      html += `<div class="look"><img src="${o.cover_url||''}"><div class="cap">${o.title||''}${o.price_from?(' · от '+fmt(o.price_from)+' ₽'):''}</div></div>`;
    }
    html += `</div>`;
    body.innerHTML = html;
  }catch(e){ body.innerHTML = `<div class="msg">Ошибка сети.</div>`; }
}

function fmt(n){ return (n||0).toLocaleString('ru-RU'); }
function slotName(s){ return ({top:'Верх',bottom:'Низ',dress:'Платье',outerwear:'Верхняя одежда',shoes:'Обувь',bag:'Сумка',accessory:'Аксессуар'})[s]||s; }
function storeName(s){ return ({befree:'Befree',sela:'SELA',tsum:'ЦУМ',finnflare:'Finn-Flare',loverepublic:'Love Republic',incantoeu:'Incanto',kanzler:'KANZLER'})[s]||s; }
</script>
</body>
</html>
