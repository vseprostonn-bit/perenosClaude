<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Obraz — Лента образов</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --text:#1A1A1E;--hint:#9A8F8F;
  --accent:#FF4D6A;--accent2:#FF8FA3;
  --border:#F2E6E2;--card:rgba(255,255,255,0.72);
  --shadow:0 4px 6px rgba(255,77,106,0.06),0 10px 24px rgba(255,143,163,0.08);
  --shadow-hover:0 8px 16px rgba(255,77,106,0.1),0 20px 48px rgba(255,143,163,0.14);
  --spring:cubic-bezier(0.16,1,0.3,1);
}
body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#FFF8F6 0%,#FFEDE8 100%);background-attachment:fixed;color:var(--text);max-width:390px;margin:0 auto;min-height:100vh;}
.header{position:sticky;top:0;z-index:10;background:rgba(255,248,246,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);}
.header h1{font-family:'Manrope',sans-serif;font-size:18px;font-weight:700;flex:1;}
.header .heart{font-size:20px;cursor:pointer;transition:transform .25s var(--spring);}
.header .heart:active{transform:scale(0.8);}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.72);backdrop-filter:blur(8px);font-size:13px;white-space:nowrap;cursor:pointer;transition:all .2s var(--spring);font-weight:500;}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,77,106,0.25);}
.masonry{column-count:2;column-gap:10px;padding:0 12px 20px;}
.card{break-inside:avoid;background:rgba(255,255,255,0.84);backdrop-filter:blur(16px);border-radius:16px;overflow:hidden;margin-bottom:10px;border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .15s var(--spring), box-shadow .15s var(--spring);cursor:pointer;}
.card:active{transform:translateY(-4px) scale(1.02);box-shadow:var(--shadow-hover);}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:linear-gradient(135deg,#FFF0F2,#FFE4D6);display:block;}
.card-body{padding:10px 12px 12px;}
.card-title{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:6px;}
.card-price{font-size:12px;color:var(--hint);margin-bottom:8px;}
.card-price strong{color:var(--accent);}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.badge{font-size:10px;padding:3px 7px;border-radius:20px;background:linear-gradient(135deg,#FFD5C2,#FFE4D6);color:var(--text);font-weight:600;}
.btn-buy{width:100%;padding:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(255,77,106,0.2);transition:transform .15s var(--spring);}
.btn-buy:active{transform:scale(0.98);}
.btn-save{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);border:1px solid var(--border);font-size:14px;cursor:pointer;transition:transform .25s var(--spring);}
.btn-save.liked{transform:scale(1.1);}
.card-wrap{position:relative;}
.sticky-cta{position:sticky;bottom:0;padding:12px 16px;background:rgba(255,248,246,0.9);backdrop-filter:blur(16px);border-top:1px solid var(--border);}
.sticky-cta button{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;box-shadow:0 4px 16px rgba(255,77,106,0.25);}
</style>
</head>
<body>
  <div class="header"><h1>Образ</h1><span class="heart" onclick="this.style.transform='scale(0.8)';setTimeout(()=>this.style.transform='',250)">♡</span></div>
  <div class="filter-row">
    <div class="chip active">Все</div><div class="chip">Учёба</div><div class="chip">Офис</div>
    <div class="chip">Свидание</div><div class="chip">Капсула</div><div class="chip">Осень</div>
  </div>
  <div class="masonry">
    <div class="card"><div class="card-wrap"><img alt="Молочный тотал"><button class="btn-save">♡</button></div><div class="card-body"><div class="card-title">Молочный тотал — осень low</div><div class="card-price">от <strong>1 200 ₽</strong> на WB</div><div class="badges"><span class="badge">WB 1 200</span><span class="badge">Lamoda 2 900</span><span class="badge">Ozon 1 450</span></div><button class="btn-buy">Где купить ↓</button></div></div>
    <div class="card"><div class="card-wrap"><img alt="Офис кэжуал"><button class="btn-save">♡</button></div><div class="card-body"><div class="card-title">Смарт-кэжуал: пиджак + джинс</div><div class="card-price">от <strong>2 400 ₽</strong></div><div class="badges"><span class="badge">Lamoda 4 200</span><span class="badge">ЯМ 3 900</span></div><button class="btn-buy">Где купить ↓</button></div></div>
    <div class="card"><div class="card-wrap"><img alt="Свидание"><button class="btn-save">♡</button></div><div class="card-body"><div class="card-title">Свидание: платье + тренч</div><div class="card-price">от <strong>3 100 ₽</strong></div><div class="badges"><span class="badge">WB 3 100</span><span class="badge">Lamoda 5 900</span></div><button class="btn-buy">Где купить ↓</button></div></div>
    <div class="card"><div class="card-wrap"><img alt="Капсула"><button class="btn-save">♡</button></div><div class="card-body"><div class="card-title">1 юбка — 3 образа</div><div class="card-price">от <strong>1 800 ₽</strong></div><div class="badges"><span class="badge">WB 1 800</span><span class="badge">Ozon 2 100</span></div><button class="btn-buy">Где купить ↓</button></div></div>
  </div>
  <div class="sticky-cta"><button>Открыть 3 образа бесплатно</button></div>
</body>
</html>
